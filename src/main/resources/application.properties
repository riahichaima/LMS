spring.application.name=lms

# Server Configuration
server.port=8089

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/lms_db?allowPublicKeyRetrieval=true&useSSL=false&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration - Clé sécurisée de 256+ bits
jwt.secret=MonSecretJWTSuperSecureKey2024PourLaSecuriteDesTokens
jwt.expiration=86400000

