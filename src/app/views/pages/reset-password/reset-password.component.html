<div class="bg-light dark:bg-transparent min-vh-100 d-flex flex-row align-items-center">
  <c-container>
    <c-row class="justify-content-center">
      <c-col lg="6" md="8" xl="5">
        <c-card class="mx-4">
          <c-card-body class="p-4">
            <div *ngIf="done(); else resetForm" class="text-center">
              <svg cIcon name="cilCheck" size="3xl" class="text-success mb-3"></svg>
              <h2>Mot de passe modifié</h2>
              <p class="text-body-secondary">Vous pouvez maintenant vous connecter avec votre nouveau mot de passe.</p>
              <div class="d-grid">
                <a cButton color="primary" routerLink="/login">Se connecter</a>
              </div>
            </div>

            <ng-template #resetForm>
              <form (ngSubmit)="onSubmit()">
                <h1>Nouveau mot de passe</h1>
                <p class="text-body-secondary">Choisissez un nouveau mot de passe pour votre compte.</p>

                <c-alert color="danger" *ngIf="errorMessage()" class="mb-3">
                  {{ errorMessage() }}
                  <div *ngIf="!token || errorMessage().includes('expiré') || errorMessage().includes('invalide')" class="mt-2">
                    <a cButton color="danger" variant="outline" size="sm" routerLink="/forgot-password">
                      Refaire une demande
                    </a>
                  </div>
                </c-alert>

                <c-input-group class="mb-3">
                  <span cInputGroupText>
                    <svg cIcon name="cilLockLocked"></svg>
                  </span>
                  <input
                    name="password"
                    [(ngModel)]="password"
                    autoComplete="new-password"
                    cFormControl
                    placeholder="Nouveau mot de passe (Ex: Pass1234!)"
                    type="password"
                    [disabled]="!token"
                    required
                    #pwd
                  />
                  <app-password-toggle [input]="pwd" />
                </c-input-group>

                <c-input-group class="mb-4">
                  <span cInputGroupText>
                    <svg cIcon name="cilLockLocked"></svg>
                  </span>
                  <input
                    name="confirmPassword"
                    [(ngModel)]="confirmPassword"
                    autoComplete="new-password"
                    cFormControl
                    placeholder="Confirmer le mot de passe"
                    type="password"
                    [disabled]="!token"
                    required
                    #pwd2
                  />
                  <app-password-toggle [input]="pwd2" />
                </c-input-group>

                <div class="d-grid gap-2">
                  <button cButton color="success" type="submit" [disabled]="loading() || !token">
                    <c-spinner aria-hidden="true" size="sm" *ngIf="loading()"></c-spinner>
                    <span *ngIf="!loading()">Réinitialiser le mot de passe</span>
                  </button>
                  <a cButton color="link" routerLink="/login" class="text-center">Retour à la connexion</a>
                </div>
              </form>
            </ng-template>
          </c-card-body>
        </c-card>
      </c-col>
    </c-row>
  </c-container>
</div>
