# Service du frontend Angular (image nginx sans root, port 8080)
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Compression : pages et scripts 3 à 5 fois plus légers sur le réseau
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml font/ttf application/vnd.ms-fontobject;

    include /etc/nginx/snippets/security-headers.conf;

    # Health check (Docker, Render, Azure…)
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Toujours la dernière version de la page et de la configuration
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }
    location = /assets/env.js {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    # Fichiers à empreinte (main-XXXXXXXX.js…) : en cache 1 an, leur nom change à chaque version
    location ~* "-[A-Z0-9]{8}\.(js|css|woff2?|ttf|svg|png|jpe?g|gif|webp)$" {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # Images et icônes sans empreinte : en cache 7 jours
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=604800" always;
    }

    # Application monopage : toute autre adresse renvoie index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
