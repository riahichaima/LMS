# Lancer le LMS complet en local à partir du code (sans passer par GitHub) :
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
# Les dossiers sont ceux du poste de développement : Desktop/lms, Desktop/LMS_Frontend, Desktop/LMS_AI.
services:
  backend:
    image: lms-backend:local
    build:
      context: ..
  frontend:
    image: lms-frontend:local
    build:
      context: ../../LMS_Frontend
  ai:
    image: lms-ai:local
    build:
      context: ../../LMS_AI
