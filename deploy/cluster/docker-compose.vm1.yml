# VM 1 avec répartiteur de charge : s'ajoute à ../docker-compose.yml (rien n'est retiré).
# Activation : dans deploy/.env de la VM 1, ajouter
#   COMPOSE_FILE=docker-compose.yml:cluster/docker-compose.vm1.yml
#   PRIVATE_IP=10.0.0.4            # adresse privée de la VM 1
#   BACKEND_2=10.0.0.5:8090        # adresse privée de la VM 2
#   REDIS_PASSWORD=...             # long et aléatoire (openssl rand -hex 24)
# puis ./update.sh comme d'habitude. Retour à un seul backend : retirer la ligne COMPOSE_FILE.
#
# Les ports ajoutés n'écoutent que sur l'adresse PRIVÉE de la VM 1 (jamais sur Internet) ;
# le groupe de sécurité réseau Azure ne les ouvre qu'à la VM 2 (voir README.md).

services:
  # Données partagées par les deux backends : vidage du cache, notifications, limites IA (aucune donnée durable)
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD:?Définir REDIS_PASSWORD dans .env}',
              '--maxmemory', '64mb', '--maxmemory-policy', 'allkeys-lru', '--save', '', '--appendonly', 'no']
    mem_limit: 96m
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG']
      interval: 10s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - '${PRIVATE_IP:?Définir PRIVATE_IP (adresse privée de la VM 1)}:6379:6379'
    networks: [interne]

  # La VM 2 lit la même base et appelle le même service IA, par le réseau privé
  db:
    ports:
      - '${PRIVATE_IP}:3306:3306'
  ai:
    ports:
      - '${PRIVATE_IP}:8000:8000'

  backend:
    hostname: backend-1
    depends_on:
      redis: { condition: service_healthy }
    environment:
      APP_CLUSTER_ENABLED: 'true'
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  # Caddy répartit entre le backend de cette VM et celui de la VM 2
  caddy:
    environment:
      BACKEND_1: backend:8090
      BACKEND_2: ${BACKEND_2:?Définir BACKEND_2 (adresse privée de la VM 2, ex. 10.0.0.5:8090)}
    volumes:
      - ./cluster/Caddyfile.cluster:/etc/caddy/Caddyfile:ro
