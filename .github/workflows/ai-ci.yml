# CI du service IA : qualité du code (Ruff) et tests pytest (validation JSON des QCM, correction, API)
# sans appel à Azure. SonarCloud facultatif (variable SONAR_PROJECT_KEY + secret SONAR_TOKEN).
name: AI CI

on:
  push:
    branches: [LMS-AI]
    paths-ignore: ['**.md']
  pull_request:
    branches: [LMS-AI]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    name: Ruff + pytest (FastAPI)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Installation
        run: pip install -r requirements-dev.txt

      - name: Qualité du code (Ruff)
        run: ruff check . --output-format=github

      - name: Tests (pytest)
        run: pytest --junitxml=pytest-report.xml

      - name: Résumé des tests
        if: always()
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET
          s = ET.parse('pytest-report.xml').getroot()
          s = s if s.tag == 'testsuite' else s.find('testsuite')
          total = int(s.get('tests', 0)); ko = int(s.get('failures', 0)) + int(s.get('errors', 0))
          print(f"### Tests IA : {total - ko}/{total} réussis")
          EOF

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ai-test-report
          path: pytest-report.xml
          retention-days: 14

      - name: SonarCloud (qualité)
        if: vars.SONAR_PROJECT_KEY != '' && github.event_name != 'pull_request'
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >-
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.sources=.
            -Dsonar.exclusions=tests/**,venv/**
            -Dsonar.tests=tests
            -Dsonar.python.version=3.12
