# Sécurité du backend : analyse du code (CodeQL), secrets (Gitleaks), dépendances vulnérables (Trivy),
# nouvelles dépendances des pull requests (Dependency Review). Résultats dans l'onglet « Security ».
name: Backend Security

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '!backend/**.md'
      - '.github/workflows/backend-security.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - '!backend/**.md'
      - '.github/workflows/backend-security.yml'
  schedule:
    - cron: '0 3 * * 1' # chaque lundi : nouvelles failles publiées entre-temps
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-security-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  codeql:
    name: CodeQL (Java)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: none
          source-root: backend
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          category: backend-codeql

  secrets:
    name: Secrets exposés (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Fichiers actuels (bloquant)
        run: >-
          docker run --rm -v "$GITHUB_WORKSPACE:/repo" -w /repo zricethezav/gitleaks:v8.30.1
          dir backend --redact --no-banner --exit-code 1
      - name: Historique complet (rapport hebdomadaire)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: >-
          docker run --rm -v "$GITHUB_WORKSPACE:/repo" -w /repo zricethezav/gitleaks:v8.30.1
          git . --redact --no-banner --exit-code 1

  dependencies:
    name: Dépendances vulnérables (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Rapport complet (onglet Security)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: backend
          scanners: vuln
          format: sarif
          output: trivy-deps.sarif
          severity: CRITICAL,HIGH,MEDIUM
      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-deps.sarif
          category: backend-dependencies
      - name: Barrière de sécurité (failles critiques corrigeables)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: backend
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  dependency-review:
    name: Nouvelles dépendances (pull request)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
