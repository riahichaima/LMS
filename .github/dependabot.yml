# Mises à jour automatiques des dépendances (pull requests hebdomadaires).
# Monorepo : un suivi par dossier (backend/, frontend/, ai/), pull requests vers main.
version: 2

updates:
  # ── Backend Spring Boot ──
  - package-ecosystem: maven
    directory: /backend
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      spring:
        patterns: ['org.springframework*', 'io.micrometer*']
      autres:
        patterns: ['*']
        exclude-patterns: ['org.springframework*', 'io.micrometer*']
  - package-ecosystem: docker
    directory: /backend
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions:
        patterns: ['*']

  # ── Frontend Angular ──
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      angular:
        patterns: ['@angular/*', '@angular-devkit/*', 'typescript', 'zone.js', 'rxjs']
      coreui:
        patterns: ['@coreui/*']
      outils-de-test:
        patterns: ['vitest', '@vitest/*', 'playwright', 'jsdom']
  - package-ecosystem: docker
    directory: /frontend
    schedule: { interval: weekly }
  - package-ecosystem: pip
    directory: /ai
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      python:
        patterns: ['*']
  - package-ecosystem: docker
    directory: /ai
    schedule: { interval: weekly }
