<app-page-header title="Contrôle financier" icon="cilChartPie"
                 subtitle="Chaque vente est partagée : 40 % pour la plateforme, 60 % pour l'enseignant (portefeuilles virtuels, Stripe en mode test).">
  <button type="button" class="btn btn-outline-secondary btn-sm" (click)="load()" [disabled]="loading()" title="Actualiser" aria-label="Actualiser">
    <svg cIcon name="cilReload" size="sm"></svg>
  </button>
</app-page-header>

<c-row>
  <c-col xs="12">

    <c-alert color="danger" *ngIf="errorMessage()" class="mb-3">{{ errorMessage() }}</c-alert>

    <div class="stat-grid stat-grid--3 mb-4" *ngIf="wallet() as w">
      <app-stat-card label="Portefeuille plateforme" icon="cilWallet" tone="primary" [highlight]="true"
                     [value]="w.totalCommission | currency:'USD'" hint="40 % des ventes" />
      <app-stat-card label="Chiffre d'affaires" icon="cilCreditCard" tone="neutral" [value]="w.grossRevenue | currency:'USD'"
                     [hint]="w.paidPayments + ' vente(s) confirmée(s)'" />
      <app-stat-card label="Revenus enseignants" icon="cilPeople" tone="success" [value]="w.totalTeacherEarnings | currency:'USD'"
                     hint="60 % des ventes" />
    </div>

    <!-- Historique financier -->
    <c-card class="mb-4">
      <c-card-header><strong>Historique financier</strong></c-card-header>
      <c-card-body>
        <table cTable [hover]="true" [responsive]="true" class="mb-0">
          <thead>
            <tr><th>Date</th><th>Portefeuille</th><th>Opération</th><th class="text-end">Montant</th><th class="text-end">Solde après</th><th>Détail</th></tr>
          </thead>
          <tbody>
            <tr *ngFor="let tx of transactions()">
              <td class="text-nowrap">{{ tx.createdAt | date:'dd/MM/yyyy HH:mm' }}</td>
              <td><c-badge [color]="tx.walletType === 'PLATFORM' ? 'primary' : 'secondary'">{{ tx.walletOwner }}</c-badge></td>
              <td>{{ txLabel(tx.type) }}</td>
              <td class="text-end fw-semibold">+{{ tx.amount | currency:'USD' }}</td>
              <td class="text-end">{{ tx.availableAfter | currency:'USD' }}</td>
              <td class="small text-body-secondary">{{ tx.description }}</td>
            </tr>
            <tr *ngIf="transactions().length === 0"><td colspan="6" class="text-center text-body-secondary py-3">Aucune opération.</td></tr>
          </tbody>
        </table>
      </c-card-body>
    </c-card>
  </c-col>
</c-row>
