<div class="bg-light dark:bg-transparent min-vh-100 d-flex flex-row align-items-center">
  <c-container>
    <c-row class="justify-content-center">
      <c-col lg="6" md="8" xl="5">
        <c-card class="mx-4">
          <c-card-body class="p-4 text-center">
            <ng-container [ngSwitch]="status()">
              <div *ngSwitchCase="'loading'">
                <c-spinner class="mb-3"></c-spinner>
                <p class="text-body-secondary">Vérification de votre email...</p>
              </div>

              <div *ngSwitchCase="'success'">
                <svg cIcon name="cilCheck" size="3xl" class="text-success mb-3"></svg>
                <h2>Email vérifié</h2>
                <p class="text-body-secondary">Votre compte est activé. Vous pouvez maintenant vous connecter.</p>
                <div class="d-grid">
                  <a cButton color="primary" routerLink="/login">Se connecter</a>
                </div>
              </div>

              <div *ngSwitchCase="'error'">
                <h2>Vérification impossible</h2>
                <c-alert color="danger" class="mb-3">{{ errorMessage() }}</c-alert>

                <form (ngSubmit)="resendVerification()" class="text-start">
                  <p class="text-body-secondary mb-2">Recevoir un nouveau lien de vérification :</p>
                  <c-input-group class="mb-3">
                    <span cInputGroupText>&#64;</span>
                    <input
                      name="email"
                      [(ngModel)]="email"
                      autoComplete="email"
                      cFormControl
                      placeholder="Adresse e-mail"
                      type="email"
                      required
                    />
                  </c-input-group>
                  <c-alert color="info" *ngIf="resendMessage()" class="mb-3">{{ resendMessage() }}</c-alert>
                  <div class="d-grid gap-2">
                    <button cButton color="primary" type="submit" [disabled]="resending() || !email">
                      <c-spinner aria-hidden="true" size="sm" *ngIf="resending()"></c-spinner>
                      Renvoyer l'email de vérification
                    </button>
                    <a cButton color="link" routerLink="/login" class="text-center">Retour à la connexion</a>
                  </div>
                </form>
              </div>
            </ng-container>
          </c-card-body>
        </c-card>
      </c-col>
    </c-row>
  </c-container>
</div>
