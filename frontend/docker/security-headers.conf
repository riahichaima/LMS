# En-têtes de sécurité (répétés dans chaque location : nginx n'hérite pas des add_header)
# Réunions en visio : caméra, micro et partage d'écran autorisés pour le site lui-même (self)
# Connexion Google : la fenêtre de Google doit pouvoir répondre au site (same-origin-allow-popups)
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
